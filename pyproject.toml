[project]
name = "outcome-switching"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastexcel>=0.19.0",
    "inspect-ai>=0.3.84",
    "openai>=1.78.1",
    "pandas>=2.3.0",
    "polars>=1.35.2",
    "pyarrow>=22.0.0",
    "rich>=13.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "statsmodels>=0.14.5",
]

[dependency-groups]
annotation = ["html-diff>=0.4.1", "label-studio-sdk>=1.0.17"]
notebooks = [
    "altair>=5.4.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "matplotlib>=3.10.6",
]
dev = [
    { include-group = "annotation" },
    { include-group = "notebooks" },
    "xlsxwriter>=3.2.9",
]
